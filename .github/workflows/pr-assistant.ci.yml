---
name: PR Assistant

on:
  pull_request:
    branches:
      - master
      - stage
      - develop
      - feature/*
      - task/*
      - improve/*
      - version/*
      - release/*
      - pre-release/*
      - bugfix/*
      - hotfix/*

concurrency:
  group: pr-assistant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout branch 🌿
        uses: actions/checkout@v4

      - name: Add labels 🏷️
        uses: actions/labeler@v5

      - name: Add assignee 🖊️
        uses: kentaro-m/auto-assign-action@v2.0.0
