  '@cypress/browserify-preprocessor': '3.0.2'
  csurf: '1.11.0'
  uuid: '8.3.2'
  babel-plugin-webpack-alias: '2.1.2'
  eslint: '8.57.1'
  supertest: '6.3.4'

ignoreScripts: false
allowBuilds:
  '@sentry/cli@2.58.6': true
  '@fortawesome/fontawesome-common-types@6.5.2': false
  '@fortawesome/fontawesome-free@6.5.2': false
  '@fortawesome/fontawesome-svg-core@6.5.2': false
  '@fortawesome/free-brands-svg-icons@6.5.2': false
  '@fortawesome/free-regular-svg-icons@6.5.2': false
  '@fortawesome/free-solid-svg-icons@6.5.2': false
  '@scarf/scarf@1.4.0': false
  esbuild@0.20.2: true
  cypress@13.8.1: true
  core-js: false
  msw@1.3.5: true
  gifsicle@5.3.0: true
  jpegtran-bin@5.0.2: true
  optipng-bin@7.0.1: true

savePrefix: ''
